apiVersion: v1
kind: ConfigMap
metadata:
  name: shell-auth-helper
  namespace: proxyns
data:
  basic_auth.sh: |
    #!/bin/sh
    #
    # Simple Basic Authentication helper for Squid
    #

    PASSWD_FILE="/etc/squid/auth/passwd"

    # Startup log (stderr is captured in kubectl logs)
    echo "Shell auth helper started." >&2

    if [ ! -f "$PASSWD_FILE" ]; then
        echo "ERROR: Password file not found: $PASSWD_FILE" >&2
        exit 1
    fi

    # Main authentication loop
    # Use 'read -r' to avoid backslash escaping issues
    while read -r line; do
        [ -z "$line" ] && continue

        # Simple parsing to avoid recursion and excessive subshells
        username=$(echo "$line" | cut -d' ' -f1)
        password=$(echo "$line" | cut -d' ' -f2-)
        
        # Strip trailing \r (CR) in case of Windows line endings
        password=$(echo "$password" | tr -d '\r')

        if [ -z "$username" ] || [ -z "$password" ]; then
            echo "ERR"
            continue
        fi

        stored_hash=$(grep "^${username}:" "$PASSWD_FILE" | cut -d':' -f2)

        if [ -z "$stored_hash" ]; then
            echo "ERR"
            echo "AUTH FAILED: $username (not found)" >&2
            continue
        fi

        # Extract salt
        salt=$(echo "$stored_hash" | cut -d'$' -f3)

        # Generate hash using Apache MD5 crypt (-apr1)
        generated_hash=$(openssl passwd -apr1 -salt "$salt" "$password")

        if [ "$generated_hash" = "$stored_hash" ]; then
            # Response must be emitted immediately
            echo "OK"
            echo "AUTH SUCCESS: $username" >&2
        else
            echo "ERR"
            echo "AUTH FAILED: $username (mismatch)" >&2
        fi
    done

---
- name: "[ {{ test_identifier }} ] Delete regular Skupper Site"
  kubernetes.core.k8s:
    state: absent
    src: "{{ playbook_dir }}/resources/regular-skupper/08.00-regular-router-will-receive-connections-skupper.yaml"
  register: regular_skupper_site_delete_result

- name: "[ {{ test_identifier }} ] Ensure regular Skupper Site is deleted"
  kubernetes.core.k8s_info:
    api_version: skupper.io/v2alpha1
    kind: Site
    namespace: regular-skupper
    name: regular-skupper-receive-connection
  register: regular_skupper_site_info
  until: regular_skupper_site_info.resources | length == 0
  retries: "{{ resource_retry_value * RESOURCE_RETRY_MULTIPLIER }}"
  delay: "{{ resource_delay_value * RESOURCE_DELAY_MULTIPLIER }}"

- name: "[ {{ test_identifier }} ] Ensure all Skupper pods are deleted"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: regular-skupper
    label_selectors:
      - "app.kubernetes.io/part-of=skupper"
  register: regular_skupper_pods
  until: regular_skupper_pods.resources | length == 0
  retries: "{{ resource_retry_value * RESOURCE_RETRY_MULTIPLIER }}"
  delay: "{{ resource_delay_value * RESOURCE_DELAY_MULTIPLIER }}"

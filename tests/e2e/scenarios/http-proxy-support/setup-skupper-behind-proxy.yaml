- name: "[ {{ test_identifier }} ] Deploy Skupper Site behind proxy"
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}{{ resourcepath }}"

- name: "[ {{ test_identifier }} ] Verify if the regular Skupper Site and Pods are ready"
  block:
    - name: "[ {{ test_identifier }} ] Wait for Skupper Site to be ready"
      kubernetes.core.k8s_info:
        api_version: skupper.io/v2alpha1
        kind: Site
        namespace: "behind-proxy"
        name: "{{ skupper_behind_proxy_name }}"
      register: behind_proxy_skupper_site
      until: >
        behind_proxy_skupper_site.resources | length > 0 and
        behind_proxy_skupper_site.resources[0].status is defined and
        behind_proxy_skupper_site.resources[0].status.conditions is defined
      retries: "{{ resource_retry_value * RESOURCE_RETRY_MULTIPLIER }}"
      delay: "{{ resource_delay_value * RESOURCE_DELAY_MULTIPLIER }}"

    - name: "[ {{ test_identifier }} ] Wait for all Skupper pods to be running"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "behind-proxy"
        label_selectors:
          - "app.kubernetes.io/part-of=skupper"
      register: behind_proxy_skupper_pods
      until: >
        behind_proxy_skupper_pods.resources | length > 0 and
        behind_proxy_skupper_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == behind_proxy_skupper_pods.resources | length
      retries: "{{ resource_retry_value * RESOURCE_RETRY_MULTIPLIER }}"
      delay: "{{ resource_delay_value * RESOURCE_DELAY_MULTIPLIER }}"
